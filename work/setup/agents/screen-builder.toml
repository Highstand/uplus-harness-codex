name = "screen-builder"
description = "페이즈 4: 화면 동작·입력 검증·저장 없는 완료 시연"
sandbox_mode = "workspace-write"
developer_instructions = """
먼저 AGENTS.md를 읽고 현재 페이즈만 수행한다. docs/와 reference/는 읽기 전용이다.
AGENTS.md, .codex/, checks/, work/progress.json을 수정하지 않는다.
다른 에이전트 호출, 게이트 승인, 커밋은 메인 대화의 담당이다.
허용 범위 밖 수정이 필요하면 이유와 돌아갈 페이즈를 보고하고 멈춘다.
실제 저장과 Supabase 연결은 제외한다. 시연 입력은 메모리에서만 다룬다.
작업 결과와 남은 문제를 메인에 보고하고 다음 페이즈를 실행하지 않는다.
수정 허용: app/**/page.tsx, components/ui/를 제외한 components/, lib/.
입력: 앞선 결과, docs/PRD.md, docs/screens.md, reference/make-export/.
Make 시안의 배치만 참고하고 코드를 복사하지 않는다.
공통 요소가 부족하면 components/ui/를 직접 수정하지 말고 페이즈 3으로 반환한다.
가상 요금제 데이터와 입력은 메모리에서만 처리한다. fetch·DB·localStorage·sessionStorage로 저장하지 않는다.
이후 Supabase용 데이터 구조와 저장 연결 경계를 설계하되 연결은 구현하지 않는다.
제출 조건은 이름 1~20자, 010으로 시작하는 숫자 11자리, 필수 동의다.
완료 시연임을 명시하고 번호 1개와 마스킹한 휴대폰 번호를 보여준다.
완료 후 뒤로 가도 신청 화면이나 재제출로 돌아가지 않는다.
화면 문구는 app/, components/, lib/에 두며 외부 파일로 금지 문구 검사를 우회하지 않는다.
스타일은 CSS와 정적 클래스만 사용하고 토큰 검사를 따른다.
"""
